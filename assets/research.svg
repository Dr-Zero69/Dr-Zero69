<svg viewBox="0 0 1000 436" width="1000" height="436" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Research: four studies"><style>:root{--bone:#2B2B2B;--muted:#7A7A7A;--dim:#A3A3A3;--rule:#C8C8C8;--ghost:#D9D9D9;--accent:#1F6F5F}.mono{font-family:ui-monospace,"SFMono-Regular","SF Mono",Menlo,Consolas,"Liberation Mono",monospace;}.rise{opacity:0;animation:rise .7s cubic-bezier(.2,.7,.2,1) forwards;}@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}.draw{stroke-dasharray:1000;stroke-dashoffset:1000;animation:draw 1.4s cubic-bezier(.6,0,.2,1) forwards;}@keyframes draw{to{stroke-dashoffset:0}}.fade{opacity:0;animation:fade .7s ease forwards;}@keyframes fade{to{opacity:1}}.a1{animation-delay:0.10s}.a2{animation-delay:0.20s}.a3{animation-delay:0.30s}.a4{animation-delay:0.40s}.a5{animation-delay:0.50s}.a6{animation-delay:0.60s}.a7{animation-delay:0.70s}.a8{animation-delay:0.80s}.a9{animation-delay:0.90s}.a10{animation-delay:1.00s}.a11{animation-delay:1.10s}.a12{animation-delay:1.20s}@media (prefers-reduced-motion:reduce){.rise,.draw,.fade,.rot,.dot,.ring{animation:none}.draw{stroke-dashoffset:0}.rise,.fade{opacity:1}}</style><g transform="translate(0 20)"><g class="rise a1"><text class="mono " x="48" y="24" font-size="18" fill="var(--bone)" letter-spacing="0.8" font-weight="700">01 / SOIL METALS → SMALL-AREA STROKE PREVALENCE</text><text class="mono " x="48" y="49" font-size="13" fill="var(--bone)">Can household soil metals, soil properties, housing, roads and demographics predict modeled stroke prevalence by census tract?</text><text class="mono " x="48" y="68" font-size="13" fill="var(--muted)">Tree ensembles and Ridge under nested leave-one-tract-out and spatially blocked validation; SHAP; honest about 36 tracts.</text><text class="mono " x="48" y="87" font-size="12" fill="var(--accent)" letter-spacing="0.4">PYTHON · SCIKIT-LEARN · SHAP · ARCGIS PRO · KRIGING · MORAN&#x27;S I  —  IJERPH, REVISED AFTER REVIEW</text><line x1="48" y1="104" x2="952" y2="104" stroke="var(--rule)" stroke-width="1"/></g></g><g transform="translate(0 124)"><g class="rise a2"><text class="mono " x="48" y="24" font-size="18" fill="var(--bone)" letter-spacing="0.8" font-weight="700">02 / PFAS MIXTURES × BUTYRYLCHOLINESTERASE</text><text class="mono " x="48" y="49" font-size="13" fill="var(--bone)">Serum PFAS and circulating BChE in U.S. adults, using the NHANES 2021–2023 cycle that measured the enzyme for the first time.</text><text class="mono " x="48" y="68" font-size="13" fill="var(--muted)">Survey-weighted quantile g-computation and single-PFAS models; WQS and BKMR sensitivity analyses.</text><text class="mono " x="48" y="87" font-size="12" fill="var(--accent)" letter-spacing="0.4">R · SURVEY · QGCOMP · GWQS · BKMR  —  TOXICS, ACCEPTED NOVEMBER 2026</text><line x1="48" y1="104" x2="952" y2="104" stroke="var(--rule)" stroke-width="1"/></g></g><g transform="translate(0 228)"><g class="rise a3"><text class="mono " x="48" y="24" font-size="18" fill="var(--bone)" letter-spacing="0.8" font-weight="700">03 / ELEMENT-SPECIFIC PREDICTABILITY OF RESIDENTIAL SOIL METALS</text><text class="mono " x="48" y="49" font-size="13" fill="var(--bone)">Multi-output machine learning for Pb, Cd, Zn, Se and Cu from covariates alone, tested with spatial blocking and an external city.</text><text class="mono " x="48" y="68" font-size="13" fill="var(--muted)">Shows which elements carry covariate signal and which do not, and why random CV overstates all of them.</text><text class="mono " x="48" y="87" font-size="12" fill="var(--accent)" letter-spacing="0.4">PYTHON · RANDOM FOREST · SPATIAL CV · GEOPANDAS  —  ENVIRONMENTS, REVISED AFTER REVIEW</text><line x1="48" y1="104" x2="952" y2="104" stroke="var(--rule)" stroke-width="1"/></g></g><g transform="translate(0 332)"><g class="rise a4"><text class="mono " x="48" y="24" font-size="18" fill="var(--bone)" letter-spacing="0.8" font-weight="700">04 / LANGUAGE MODELS × URINARY BIOMONITORING</text><text class="mono " x="48" y="49" font-size="13" fill="var(--bone)">An NHANES-based reference set so that LLMs interpreting urinary biomonitoring results can be scored against truth.</text><text class="mono " x="48" y="68" font-size="13" fill="var(--muted)">Phase 0 complete: analyte and cycle selection, detection audit, joint cohort. Phase 1: weighted percentiles.</text><text class="mono " x="48" y="87" font-size="12" fill="var(--accent)" letter-spacing="0.4">NHANES 2011–2018 · PYTHON · DESIGN-BASED ESTIMATION · LLM EVALUATION  —  IN PROGRESS</text><line x1="48" y1="104" x2="952" y2="104" stroke="var(--rule)" stroke-width="1"/></g></g></svg>