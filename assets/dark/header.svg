<svg viewBox="0 0 1000 400" width="1000" height="400" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Anurodh Jha — Environmental Epidemiology, Machine Learning, Geospatial Analysis"><style>:root{--bone:#E6E6E6;--muted:#8A8A8A;--dim:#6A6A6A;--rule:#3A3A3A;--ghost:#262626;--accent:#6FCFB5}.mono{font-family:ui-monospace,"SFMono-Regular","SF Mono",Menlo,Consolas,"Liberation Mono",monospace;}.rise{opacity:0;animation:rise .7s cubic-bezier(.2,.7,.2,1) forwards;}@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}.draw{stroke-dasharray:1000;stroke-dashoffset:1000;animation:draw 1.4s cubic-bezier(.6,0,.2,1) forwards;}@keyframes draw{to{stroke-dashoffset:0}}.fade{opacity:0;animation:fade .7s ease forwards;}@keyframes fade{to{opacity:1}}.a1{animation-delay:0.10s}.a2{animation-delay:0.20s}.a3{animation-delay:0.30s}.a4{animation-delay:0.40s}.a5{animation-delay:0.50s}.a6{animation-delay:0.60s}.a7{animation-delay:0.70s}.a8{animation-delay:0.80s}.a9{animation-delay:0.90s}.a10{animation-delay:1.00s}.a11{animation-delay:1.10s}.a12{animation-delay:1.20s}@media (prefers-reduced-motion:reduce){.rise,.draw,.fade,.rot,.dot,.ring{animation:none}.draw{stroke-dashoffset:0}.rise,.fade{opacity:1}}.rot{opacity:0;animation:rot 16s linear infinite;}.r1{animation-delay:1.6s}.r2{animation-delay:5.6s}.r3{animation-delay:9.6s}.r4{animation-delay:13.6s}@keyframes rot{0%{opacity:0}1.5%{opacity:1}22%{opacity:1}25%{opacity:0}100%{opacity:0}}@media (prefers-reduced-motion:reduce){.rot{opacity:0}.rot.r1{opacity:1}}</style><line class="draw a1" x1="48" y1="58" x2="952" y2="58" stroke="var(--rule)" stroke-width="1"/><text class="mono fade a1" x="48" y="44" font-size="11" fill="var(--muted)" letter-spacing="3.5">PROFILE — INDEX Nº 001</text><text class="mono fade a1" x="952" y="44" font-size="11" fill="var(--muted)" text-anchor="end" letter-spacing="3.5">GREENSBORO, NC — 36.07° N &amp; 79.79° W</text><text class="mono rise a2" x="46" y="176" font-size="72" fill="var(--bone)" letter-spacing="-1" font-weight="700">ANURODH JHA</text><text class="mono rise a3" x="48" y="224" font-size="20" fill="var(--accent)">Environmental Epidemiology · Machine Learning · Geospatial Analysis</text><text class="mono rise a4" x="48" y="262" font-size="15" fill="var(--muted)">PhD Candidate, Applied Science &amp; Technology · North Carolina A&amp;T State University</text><line class="draw a4" x1="48" y1="296" x2="952" y2="296" stroke="var(--rule)" stroke-width="1"/><text class="mono rot r1" x="48" y="334" font-size="15" fill="var(--bone)">Predicting residential soil metals, and reporting honestly when they will not be predicted.</text><text class="mono rot r2" x="48" y="334" font-size="15" fill="var(--bone)">PFAS mixtures and a liver enzyme that NHANES had never measured before 2021.</text><text class="mono rot r3" x="48" y="334" font-size="15" fill="var(--bone)">Small-area stroke prevalence from soil, housing, roads and demographics.</text><text class="mono rot r4" x="48" y="334" font-size="15" fill="var(--bone)">Teaching language models to read a urinary biomonitoring panel against a reference set.</text><text class="mono fade a6" x="48" y="372" font-size="12" fill="var(--muted)" letter-spacing="1">CURRENTLY ▸ dissertation on pollutant distribution, exposure risk and health outcomes · four studies · May 2027</text></svg>