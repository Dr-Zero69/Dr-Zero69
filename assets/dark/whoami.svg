<svg viewBox="0 0 1000 236" width="1000" height="236" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="About Anurodh"><style>:root{--bone:#E6E6E6;--muted:#8A8A8A;--dim:#6A6A6A;--rule:#3A3A3A;--ghost:#262626;--accent:#6FCFB5}.mono{font-family:ui-monospace,"SFMono-Regular","SF Mono",Menlo,Consolas,"Liberation Mono",monospace;}.rise{opacity:0;animation:rise .7s cubic-bezier(.2,.7,.2,1) forwards;}@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}.draw{stroke-dasharray:1000;stroke-dashoffset:1000;animation:draw 1.4s cubic-bezier(.6,0,.2,1) forwards;}@keyframes draw{to{stroke-dashoffset:0}}.fade{opacity:0;animation:fade .7s ease forwards;}@keyframes fade{to{opacity:1}}.a1{animation-delay:0.10s}.a2{animation-delay:0.20s}.a3{animation-delay:0.30s}.a4{animation-delay:0.40s}.a5{animation-delay:0.50s}.a6{animation-delay:0.60s}.a7{animation-delay:0.70s}.a8{animation-delay:0.80s}.a9{animation-delay:0.90s}.a10{animation-delay:1.00s}.a11{animation-delay:1.10s}.a12{animation-delay:1.20s}@media (prefers-reduced-motion:reduce){.rise,.draw,.fade,.rot,.dot,.ring{animation:none}.draw{stroke-dashoffset:0}.rise,.fade{opacity:1}}</style><text class="mono rise a1" x="48" y="32" font-size="16" fill="var(--bone)">PhD candidate, North Carolina A&amp;T State University, Greensboro, NC. Environmental Health &amp; Disease Lab.</text><text class="mono rise a2" x="48" y="60" font-size="16" fill="var(--bone)">I work where environmental measurements, biomonitoring data and predictive models meet,</text><text class="mono rise a2" x="48" y="84" font-size="16" fill="var(--bone)">and I care whether a model survives honest validation: blocked, nested, weighted, uncertain.</text><line class="rise a3" x1="48" y1="112" x2="952" y2="112" stroke="var(--rule)" stroke-width="1" opacity=".6"/><text class="mono rise a4" x="48" y="146" font-size="12" fill="var(--muted)" letter-spacing="2.5">FOCUS  ▸</text><text class="mono rise a4" x="164" y="146" font-size="16" fill="var(--bone)">Exposure science · Mixture epidemiology · Spatial ML · Agentic AI · LLMs · RAG</text><text class="mono rise a5" x="48" y="180" font-size="12" fill="var(--muted)" letter-spacing="2.5">DATA  ▸</text><text class="mono rise a5" x="164" y="180" font-size="16" fill="var(--bone)">Soil metals · Serum PFAS · Urinary biomonitoring · CDC PLACES · Census &amp; TIGER</text><text class="mono rise a6" x="48" y="214" font-size="12" fill="var(--muted)" letter-spacing="2.5">STATUS  ▸</text><text class="mono rise a6" x="164" y="214" font-size="16" fill="var(--accent)">Prelims submitted · one paper accepted, two under review · open to collaboration</text></svg>