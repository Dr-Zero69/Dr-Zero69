<svg viewBox="0 0 1000 332" width="1000" height="332" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Side projects"><style>:root{--bone:#E6E6E6;--muted:#8A8A8A;--dim:#6A6A6A;--rule:#3A3A3A;--ghost:#262626;--accent:#6FCFB5}.mono{font-family:ui-monospace,"SFMono-Regular","SF Mono",Menlo,Consolas,"Liberation Mono",monospace;}.rise{opacity:0;animation:rise .7s cubic-bezier(.2,.7,.2,1) forwards;}@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}.draw{stroke-dasharray:1000;stroke-dashoffset:1000;animation:draw 1.4s cubic-bezier(.6,0,.2,1) forwards;}@keyframes draw{to{stroke-dashoffset:0}}.fade{opacity:0;animation:fade .7s ease forwards;}@keyframes fade{to{opacity:1}}.a1{animation-delay:0.10s}.a2{animation-delay:0.20s}.a3{animation-delay:0.30s}.a4{animation-delay:0.40s}.a5{animation-delay:0.50s}.a6{animation-delay:0.60s}.a7{animation-delay:0.70s}.a8{animation-delay:0.80s}.a9{animation-delay:0.90s}.a10{animation-delay:1.00s}.a11{animation-delay:1.10s}.a12{animation-delay:1.20s}@media (prefers-reduced-motion:reduce){.rise,.draw,.fade,.rot,.dot,.ring{animation:none}.draw{stroke-dashoffset:0}.rise,.fade{opacity:1}}</style><g transform="translate(0 20)"><g class="rise a1"><text class="mono " x="48" y="24" font-size="17" fill="var(--bone)" letter-spacing="0.8" font-weight="700">05 / VALORANT WIN-RATE PREDICTION</text><text class="mono " x="48" y="49" font-size="12" fill="var(--bone)">Player performance statistics (K/D, kills, deaths, assists, maps, agents) as predictors of win rate.</text><text class="mono " x="48" y="68" font-size="12" fill="var(--muted)">A weekend of feature engineering and model comparison in a notebook, because epidemiologists also play games.</text><text class="mono " x="48" y="87" font-size="11" fill="var(--accent)" letter-spacing="0.4">JUPYTER · PYTHON · SCIKIT-LEARN  —  github.com/Dr-Zero69/Valorant-Win-Rate-Prediction</text><line x1="48" y1="104" x2="952" y2="104" stroke="var(--rule)" stroke-width="1"/></g></g><g transform="translate(0 124)"><g class="rise a2"><text class="mono " x="48" y="24" font-size="17" fill="var(--bone)" letter-spacing="0.8" font-weight="700">06 / FIREBRAND TRAJECTORY PREDICTOR</text><text class="mono " x="48" y="49" font-size="12" fill="var(--bone)">Predicting where wind-borne embers land, an input to wildfire spread and structure-ignition risk.</text><text class="mono " x="48" y="68" font-size="12" fill="var(--muted)">Physics-informed features with a learned trajectory model.</text><text class="mono " x="48" y="87" font-size="11" fill="var(--accent)" letter-spacing="0.4">PYTHON · SIMULATION  —  github.com/Dr-Zero69/Firebrand-Trajectory-Predictor</text><line x1="48" y1="104" x2="952" y2="104" stroke="var(--rule)" stroke-width="1"/></g></g><g transform="translate(0 228)"><g class="rise a3"><text class="mono " x="48" y="24" font-size="17" fill="var(--bone)" letter-spacing="0.8" font-weight="700">07 / BATTERY HEATING AND HEATER SIGNAL</text><text class="mono " x="48" y="49" font-size="12" fill="var(--bone)">Thermal behaviour of a battery pack and the control signal that keeps it in its operating window.</text><text class="mono " x="48" y="68" font-size="12" fill="var(--muted)">Signal processing and modelling of heater response.</text><text class="mono " x="48" y="87" font-size="11" fill="var(--accent)" letter-spacing="0.4">PYTHON  —  github.com/Dr-Zero69/Battery-heating-and-heater-signal</text><line x1="48" y1="104" x2="952" y2="104" stroke="var(--rule)" stroke-width="1"/></g></g></svg>