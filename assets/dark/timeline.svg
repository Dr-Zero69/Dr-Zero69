<svg viewBox="0 0 1000 220" width="1000" height="220" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Route: 2022 to 2027"><style>:root{--bone:#E6E6E6;--muted:#8A8A8A;--dim:#6A6A6A;--rule:#3A3A3A;--ghost:#262626;--accent:#6FCFB5}.mono{font-family:ui-monospace,"SFMono-Regular","SF Mono",Menlo,Consolas,"Liberation Mono",monospace;}.rise{opacity:0;animation:rise .7s cubic-bezier(.2,.7,.2,1) forwards;}@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}.draw{stroke-dasharray:1000;stroke-dashoffset:1000;animation:draw 1.4s cubic-bezier(.6,0,.2,1) forwards;}@keyframes draw{to{stroke-dashoffset:0}}.fade{opacity:0;animation:fade .7s ease forwards;}@keyframes fade{to{opacity:1}}.a1{animation-delay:0.10s}.a2{animation-delay:0.20s}.a3{animation-delay:0.30s}.a4{animation-delay:0.40s}.a5{animation-delay:0.50s}.a6{animation-delay:0.60s}.a7{animation-delay:0.70s}.a8{animation-delay:0.80s}.a9{animation-delay:0.90s}.a10{animation-delay:1.00s}.a11{animation-delay:1.10s}.a12{animation-delay:1.20s}@media (prefers-reduced-motion:reduce){.rise,.draw,.fade,.rot,.dot,.ring{animation:none}.draw{stroke-dashoffset:0}.rise,.fade{opacity:1}}</style><line class="draw" x1="110" y1="10" x2="110" y2="210" stroke="var(--rule)" stroke-width="1"/><text class="mono rise a1" x="48" y="38" font-size="14" fill="var(--muted)" letter-spacing="1">2022</text><circle class="rise a1" cx="110" cy="34" r="3.5" fill="var(--dim)"/><text class="mono rise a1" x="132" y="39" font-size="15" fill="var(--bone)">Joined GitHub. First notebooks.</text><text class="mono rise a2" x="48" y="78" font-size="14" fill="var(--muted)" letter-spacing="1">2024</text><circle class="rise a2" cx="110" cy="74" r="3.5" fill="var(--dim)"/><text class="mono rise a2" x="132" y="79" font-size="15" fill="var(--bone)">Firebrand trajectory predictor · Azure AI Vision labs · first spatial models.</text><text class="mono rise a3" x="48" y="118" font-size="14" fill="var(--muted)" lette