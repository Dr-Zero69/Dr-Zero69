<svg viewBox="0 0 1000 92" width="1000" height="92" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Section 06 — stack"><style>:root{--bone:#2B2B2B;--muted:#7A7A7A;--dim:#A3A3A3;--rule:#C8C8C8;--ghost:#D9D9D9;--accent:#1F6F5F}.mono{font-family:ui-monospace,"SFMono-Regular","SF Mono",Menlo,Consolas,"Liberation Mono",monospace;}.rise{opacity:0;animation:rise .7s cubic-bezier(.2,.7,.2,1) forwards;}@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}.draw{stroke-dasharray:1000;stroke-dashoffset:1000;animation:draw 1.4s cubic-bezier(.6,0,.2,1) forwards;}@keyframes draw{to{stroke-dashoffset:0}}.fade{opacity:0;animation:fade .7s ease forwards;}@keyframes fade{to{opacity:1}}.a1{animation-delay:0.10s}.a2{animation-delay:0.20s}.a3{animation-delay:0.30s}.a4{animation-delay:0.40s}.a5{animation-delay:0.50s}.a6{animation-delay:0.60s}.a7{animation-delay:0.70s}.a8{animation-delay:0.80s}.a9{animation-delay:0.90s}.a10{animation-delay:1.00s}.a11{animation-delay:1.10s}.a12{animation-delay:1.20s}@media (prefers-reduced-motion:reduce){.rise,.draw,.fade,.rot,.dot,.ring{animation:none}.draw{stroke-dashoffset:0}.rise,.fade{opacity:1}}</style><line class="draw" x1="48" y1="78" x2="952" y2="78" stroke="var(--rule)" stroke-width="1"/><text class="mono fade a1" x="48" y="68" font-size="52" fill="var(--ghost)">06</text><text class="mono fade a2" x="128" y="58" font-size="14" fill="var(--accent)" letter-spacing="6">STACK</text><text class="mono fade a2" x="952" y="58" font-size="11" fill="var(--muted)" text-anchor="end" letter-spacing="2">SECTION 06 / 06</text></svg>