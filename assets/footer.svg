<svg viewBox="0 0 1000 110" width="1000" height="110" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Status"><style>:root{--bone:#2B2B2B;--muted:#7A7A7A;--dim:#A3A3A3;--rule:#C8C8C8;--ghost:#D9D9D9;--accent:#1F6F5F}.mono{font-family:ui-monospace,"SFMono-Regular","SF Mono",Menlo,Consolas,"Liberation Mono",monospace;}.rise{opacity:0;animation:rise .7s cubic-bezier(.2,.7,.2,1) forwards;}@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}.draw{stroke-dasharray:1000;stroke-dashoffset:1000;animation:draw 1.4s cubic-bezier(.6,0,.2,1) forwards;}@keyframes draw{to{stroke-dashoffset:0}}.fade{opacity:0;animation:fade .7s ease forwards;}@keyframes fade{to{opacity:1}}.a1{animation-delay:0.10s}.a2{animation-delay:0.20s}.a3{animation-delay:0.30s}.a4{animation-delay:0.40s}.a5{animation-delay:0.50s}.a6{animation-delay:0.60s}.a7{animation-delay:0.70s}.a8{animation-delay:0.80s}.a9{animation-delay:0.90s}.a10{animation-delay:1.00s}.a11{animation-delay:1.10s}.a12{animation-delay:1.20s}@media (prefers-reduced-motion:reduce){.rise,.draw,.fade,.rot,.dot,.ring{animation:none}.draw{stroke-dashoffset:0}.rise,.fade{opacity:1}}.dot{animation:p 2.4s ease-in-out infinite}.ring{animation:r 2.4s ease-out infinite;transform-origin:60px 64px}@keyframes p{0%,100%{opacity:1}50%{opacity:.35}}@keyframes r{0%{transform:scale(.4);opacity:.8}80%,100%{transform:scale(2.6);opacity:0}}</style><line class="draw" x1="48" y1="24" x2="952" y2="24" stroke="var(--rule)" stroke-width="1"/><circle class="ring" cx="60" cy="64" r="5" stroke="var(--accent)" stroke-width="1" fill="none"/><circle class="dot" cx="60" cy="64" r="4" fill="var(--accent)"/><text class="mono " x="82" y="62" font-size="13" fill="var(--bone)" letter-spacing="3">STATUS — RESEARCH, COOK, WORKOUT AND WORK ON MY 1000 HOBBIES :D</text><text class="mono " x="82" y="82" font-size="12" fill="var(--muted)" letter-spacing="2">&quot;If the held-out error is good, check the folds.&quot; — Dr. Zero</text><text class="mono " x="952" y="66" font-size="16" fill="var(--muted)" text-anchor="end">Greensboro, NC   ·   © 2026</text></svg>